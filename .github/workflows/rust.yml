name: Test

on:
  workflow_dispatch:

jobs:
  inputs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install stable
      uses: actions-rs/toolchain@v1
      with:
          toolchain: stable
          override: true
          components: rustfmt
    - name: Test generators with default features
      run: cargo +stable test --manifest-path sort_test_tools/Cargo.toml --locked
    - name: Test generators without default features
      run: cargo +stable test --manifest-path sort_test_tools/Cargo.toml --locked --no-default-features
    - name: Check generator formatting
      run: cargo +stable fmt --manifest-path sort_test_tools/Cargo.toml --check

  research:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install the nightly pinned in rust-toolchain.toml
      run: |
        rustup toolchain install
    - name: Check the benchmarks, including the features the writeups rely on
      run: cargo check --benches --locked --features rust_std_vendored,partition,partition_point,selection
    - name: Run the sort correctness harness
      run: cargo test --manifest-path sort_test_tools/Cargo.toml --locked --no-default-features --features test-harness

  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install the nightly pinned in rust-toolchain.toml
      run: |
        rustup toolchain install
        rustup component add rustfmt
    - name: Build
      run: |
        cd ipnsort
        cargo build --verbose
    - name: Run tests
      run: |
        cd ipnsort
        cargo test --verbose
    - name: Check rustfmt
      run: |
        cd ipnsort
        cargo fmt --check

  miri:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install the nightly pinned in rust-toolchain.toml
      run: |
        rustup toolchain install
        rustup component add miri rust-src
    - name: Install cargo-nextest
      run: |
        curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
    - name: Run tests x86_64-unknown-linux-gnu (little-endian)
      run: |
        cd ipnsort
        cargo miri nextest run --verbose --target x86_64-unknown-linux-gnu -j4
    - name: Run tests mips64-unknown-linux-gnuabi64 (big-endian)
      run: |
        cd ipnsort
        cargo miri test --verbose --target mips64-unknown-linux-gnuabi64 random_z1

  asan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    - name: Install the nightly pinned in rust-toolchain.toml
      run: |
        rustup toolchain install
    - name: Run tests 
      run: |
        cd ipnsort
        bash -c "for i in {0..100}; do RUSTFLAGS=-Zsanitizer=address cargo test --no-default-features --release; done"
    - name: Run tests with large test sizes
      run: |
        cd ipnsort
        bash -c "for i in {0..2}; do RUSTFLAGS=-Zsanitizer=address cargo test --release; done"
